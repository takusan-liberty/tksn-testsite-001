<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <meta name="robots" content="noindex">
    <style>
        body {
            background-color: #0a0b10;
            color: #e0e0e0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 2rem;
        }

        /* 近未来風ボタンのスタイル */
        .cyber-button {
            display: inline-block;
            padding: 15px 30px;
            background: linear-gradient(45deg, #00f2ff, #0066ff);
            color: white;
            text-decoration: none;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 5px;
            position: relative;
            transition: 0.3s;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .cyber-button:hover {
            background: transparent;
            box-shadow: 0 0 25px rgba(0, 242, 255, 0.8);
            border-color: #00f2ff;
            color: #00f2ff;
        }

        .cyber-button::before {
            content: ">> ";
        }

        /* AI待機中アニメーションのベース */
        .ai-background {
            position: fixed; /* 画面下部に固定 */
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px; /* お好みの高さに調整 */
            z-index: -1; /* コンテンツの後ろに配置 */
            background: linear-gradient(
                45deg, 
                #00c3ff, 
                #0066ff, 
                #c233fa, 
                #00c3ff
            );
            background-size: 400% 400%;
            animation: gradient-float 8s ease infinite;
            filter: blur(60px); /* ふわふわ感を出すためのぼかし */
            opacity: 0.8; /* 透過度 */
        }

        @keyframes gradient-float {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body>
    <div class="ai-background"></div>
    <h1>Hello World!!!</h1>
    
    <div style="margin-bottom: 30px;">
        <a href="./pages-001/" class="cyber-button">Access to Pages-001</a>
    </div>

    <h2>Links</h2>
    <ul>
        <li>
            <strong>IWN PACIFIC 公式サイト</strong><br>
            <a href="https://iwnpacific.com">https://iwnpacific.com</a>
        </li>
        <br>
        <li>
            <strong>Takusan Web (Blog)</strong><br>
            <a href="https://takusan.212sitepark.com/">https://takusan.212sitepark.com/</a>
        </li>
     </ul>
     <p>このサイトはNASの中で動作しています</p>
     <p>This page is Local Network Only</p>

</body>
</html>
